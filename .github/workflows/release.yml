name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Repository rules must also protect v* tags; this check independently blocks
      # publishing a tag whose commit is not reachable from main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not reachable from origin/main: $GITHUB_SHA" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Parse tag
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $GITHUB_REF" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build astro-jsx-pages
        run: bun run --cwd packages/astro-jsx-pages build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit & integration tests
        run: bun test tests/unit tests/integration tests/e2e tests/conformance

      - name: Workers host tests
        run: bun test packages/workers/test

      # Prints one `<package>=<tarball>` line per release tarball.
      - name: Package release tarballs
        id: package
        run: bun run package:pletivo --version "${{ steps.tag.outputs.version }}" --output "$RUNNER_TEMP/pletivo-package" >> "$GITHUB_OUTPUT"

      - name: Test the exact pletivo tarball as a consumer
        run: bun run tests/consumer-typecheck.ts --tarball "${{ steps.package.outputs.pletivo }}"

      - name: Test the exact Workers host tarballs as a consumer
        run: >-
          bun run tests/workers-consumer-check.ts
          --tarball "${{ steps.package.outputs.runtime }}"
          --tarball "${{ steps.package.outputs.core }}"
          --tarball "${{ steps.package.outputs.workers }}"

      # Dependency order: each package's exact-version @pletivo/* dependencies are
      # already on the registry when it lands.
      - name: Publish @pletivo/runtime
        run: npm publish "${{ steps.package.outputs.runtime }}" --provenance --access public

      - name: Publish @pletivo/core
        run: npm publish "${{ steps.package.outputs.core }}" --provenance --access public

      - name: Publish @pletivo/workers
        run: npm publish "${{ steps.package.outputs.workers }}" --provenance --access public

      - name: Publish pletivo
        run: npm publish "${{ steps.package.outputs.pletivo }}" --provenance --access public
