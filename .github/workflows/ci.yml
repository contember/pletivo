name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets the branch below it, not main,
  # and must still be tested.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build astro-jsx-pages
        run: bun run --cwd packages/astro-jsx-pages build

      # pletivo publishes raw src/ (its exports map points at .ts), so every
      # consumer typechecks these files — a type error here breaks downstream
      # builds even though Bun strips types at runtime. Keep this gated.
      # Two programs: the package itself, and the repo's own consumers of it
      # (tests/, examples/basic) which catch drift in the exported types.
      - name: Typecheck
        run: bun run typecheck

      - name: Package distribution tests
        run: bun test tests/unit/package-distribution.test.ts tests/unit/package-boundaries.test.ts

      # Prints one `<package>=<tarball>` line per release tarball.
      - name: Package release tarballs
        id: package
        run: bun run package:pletivo --version 0.0.0 --output "$RUNNER_TEMP/pletivo-package" >> "$GITHUB_OUTPUT"

      # npm installs only the staged pletivo tarball and public dependencies.
      - name: Test the exact pletivo tarball as a consumer
        run: bun run tests/consumer-typecheck.ts --tarball "${{ steps.package.outputs.pletivo }}"

      # A fresh npm install of the Workers host and its siblings, typechecked and
      # bundled the way a host Worker consumes them.
      - name: Test the exact Workers host tarballs as a consumer
        run: >-
          bun run tests/workers-consumer-check.ts
          --tarball "${{ steps.package.outputs.runtime }}"
          --tarball "${{ steps.package.outputs.core }}"
          --tarball "${{ steps.package.outputs.workers }}"

      - name: Unit & integration tests
        run: bun test tests/unit tests/integration tests/e2e tests/conformance

      - name: Workers host tests
        run: bun test packages/workers/test

      - name: Workers local workerd qualification
        run: bun run --cwd packages/workers test:workerd

      - name: Setup Astro compatibility tests
        working-directory: tests/astro-e2e
        run: |
          bun install
          bun run setup.ts

      - name: Astro compatibility — integration
        working-directory: tests/astro-e2e
        run: node --test integration/*.test.js

      - name: Install Playwright
        working-directory: tests/astro-e2e
        run: bunx playwright install chromium

      - name: Astro compatibility — e2e
        working-directory: tests/astro-e2e
        run: bunx playwright test

  build-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build basic example
        run: bun run --cwd examples/basic build
